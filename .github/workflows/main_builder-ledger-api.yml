
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - builder-ledger-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore Backend/BuilderLedger/BuilderLedger.API/BuilderLedger.API.csproj

      - name: Build with dotnet
        run: dotnet build Backend/BuilderLedger/BuilderLedger.API/BuilderLedger.API.csproj --configuration Release --no-restore

      - name: Publish with dotnet
        run: dotnet publish Backend/BuilderLedger/BuilderLedger.API/BuilderLedger.API.csproj --configuration Release --no-build -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3E295B52AD0B4BA398DED4A1A908B3EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D54D972CCE184FB29B384A56322DFAC6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE825DBE296545519D13E225E6CC6D75 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'builder-ledger-api'
          slot-name: 'Production'
          package: ./publish
